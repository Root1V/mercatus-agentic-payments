[project]
name = "agent-commerce"
version = "0.1.0"
description = "Framework de doble cara (vender/comprar) para agentic commerce, con adaptadores intercambiables de protocolo de pago (x402, AP2) y de custodia de wallet (local, Circle)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Emeric V. Espiritu Santiago" }]
requires-python = ">=3.11"
dependencies = [
  "x402[fastapi,httpx,requests,evm]>=2.21,<3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.28",
  "requests>=2.31",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "eth-account>=0.13",
]

[project.optional-dependencies]
ap2 = ["ap2>=0.1.1,<0.2"]
circle = ["circle-developer-controlled-wallets>=9.6,<10"]
dashboard = [
  "agent-commerce[ap2]",     # el dashboard siempre expone AMBOS protocolos (x402 y AP2)
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<4.1",              # passlib 1.7.4 rompe con bcrypt>=4.1 (pyca/bcrypt#684)
  "python-multipart>=0.0.9", # requerido por OAuth2PasswordRequestForm
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
agent-commerce = "agent_commerce.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_commerce"]

[tool.pytest.ini_options]
markers = ["testnet: requires real Circle/x402 credentials and a funded testnet wallet"]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# typer.Option(...)/typer.Argument(...) en valores por defecto es el patrón
# idiomático de typer (así declara sus flags de CLI), no un bug de mutable-default.
"src/agent_commerce/cli/main.py" = ["B008"]
# Depends(...) en valores por defecto es el patrón idiomático de FastAPI para
# inyección de dependencias -- mismo motivo que el ignore de arriba.
"src/agent_commerce/dashboard/app.py" = ["B008"]
"src/agent_commerce/auth/router.py" = ["B008"]
"src/agent_commerce/auth/dependencies.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
