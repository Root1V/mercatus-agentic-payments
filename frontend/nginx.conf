server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mismo truco que el proxy de dev de Vite: el frontend llama a rutas
    # relativas /api/..., nginx las reenvía al servicio `api` de docker-compose.
    # Así en producción tampoco hace falta configurar CORS.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta que no sea un archivo real cae en index.html
    # (react-router-dom maneja el resto client-side).
    location / {
        try_files $uri /index.html;
    }
}
